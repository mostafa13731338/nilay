<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nilay Trade | International Trade & B2B Market Development</title>
    <meta name="description" content="Connecting Iranian producers and businesses to global markets. International market research, export development, and verified B2B commercial connectivity." />
    <meta property="og:title" content="Nilay Trade | International Trade & B2B Market Development" />
    <meta property="og:description" content="Connecting Iranian producers and businesses to global markets through market intelligence and verified B2B connectivity." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Google Fonts for Persian & English typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F8FAFC] text-[#071D35] antialiased selection:bg-[#0F8B8D]/20 selection:text-[#071D35] overflow-x-hidden">
    <div id="root"></div>

    <!-- Hidden Netlify form template for SPA build-time detection -->
    <form name="consultation" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="consultation" />
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="productCategory" />
      <input type="text" name="topic" />
      <textarea name="message"></textarea>
    </form>

    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
